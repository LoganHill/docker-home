services:
  # Read-only Docker API for Traefik's docker provider. Mounting the socket :ro
  # into Traefik still exposes the whole API (it only stops writes to the
  # socket file), so Traefik talks to this instead: GET-only, and only the
  # container/events/version/ping endpoints.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    container_name: traefik-socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      # EVENTS, PING and VERSION are allowed by default; everything else,
      # including any POST, is denied.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-socket

  traefik:
    image: traefik:v3.4.5@sha256:06ddf61ee653caf4f4211a604e657f084f4727f762c16f826c97aafbefcb279e
    container_name: traefik
    restart: always
    security_opt:
      - no-new-privileges:true

    networks:
      proxy:
        # Fixed so Grafana can trust its auth-proxy header from Traefik only
        # (auth.proxy whitelist in monitoring/grafana/grafana.ini).
        ipv4_address: 172.23.255.250
      immich:
      traefik-socket:

    depends_on:
      - socket-proxy

    env_file:
      - .env

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /srv/traefik/certs:/certs:ro
      - ./dynamic:/dynamic:ro
      - /srv/traefik/letsencrypt:/letsencrypt

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"

      # Attach the static configuration tls.yaml file that contains the tls configuration settings
      - "--providers.file.filename=/dynamic/config.toml"

      # Providers 
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://traefik-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.file.watch=true"

      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--serversTransport.insecureSkipVerify=true"

      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.dnsChallenge.propagation.delayBeforeChecks=60"
      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge.provider=cloudflare"
      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge=true"
      - "--certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"

      # Timeout increase for Immich
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=600s"

  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      traefik.enable: true
      traefik.docker.network: proxy

      # Dashboard router
      traefik.http.routers.dashboard.rule: Host(`traefik.loganhill.nz`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.tls: true
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard.middlewares: authentik@docker

networks:
  # Traefik <-> socket proxy only; no outside access.
  traefik-socket:
    name: traefik-socket
    internal: true
  proxy:
    name: proxy
    external: true
  immich:
    name: immich
    external: true
