# Probe modules for exporter_blackbox. Targets live in prometheus.yml.
modules:
  # Public hostnames through Traefik: TLS must be valid and the route must answer.
  # Anything behind forward-auth answers with a redirect to Authentik even when
  # the app is down, so this only proves Traefik + certs; backend_http covers the app.
  edge_https:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 301, 302, 307, 401]
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4

  # Apps directly on the Docker network (health endpoints, no Traefik/Authentik).
  backend_http:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 302]
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true   # unifi-os-server's self-signed backend cert

  # Pi-hole must answer a local record (split-horizon) and an upstream one.
  dns_local:
    prober: dns
    timeout: 5s
    dns:
      query_name: grafana.loganhill.nz
      query_type: A
      preferred_ip_protocol: ip4
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: [".*\\sIN\\s+(A|CNAME)\\s+.*"]
  dns_upstream:
    prober: dns
    timeout: 5s
    dns:
      query_name: cloudflare.com
      query_type: A
      preferred_ip_protocol: ip4
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: [".*\\sIN\\s+A\\s+.*"]

  # LAN devices. Docker allows unprivileged ICMP sockets in containers.
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
