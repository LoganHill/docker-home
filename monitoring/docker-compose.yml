services:
  grafana:
    depends_on:
      - prometheus
    image: grafana/grafana-enterprise:13.0.1-security-01@sha256:9d4017a1a3b480262281dc24f143af64c3de26b8c934d4bc3ab0d4e30ee3a476
    container_name: grafana
    restart: always
    user: '472:472'
    networks:
      - proxy
      - monitoring
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.loganhill.nz/
    volumes:
      - "/srv/grafana/data:/var/lib/grafana"
      - "./grafana/grafana.ini:/etc/grafana/grafana.ini"
      - "./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.loganhill.nz`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.grafana.middlewares=authentik@docker"

  prometheus:
    image: prom/prometheus:v3.11.3@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    container_name: prometheus
    restart: always
    user: root
    networks:
      - proxy
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.size=32GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      # Links in alert notifications ("Source:") point here instead of prometheus:9090
      - "--web.external-url=https://prometheus.loganhill.nz/"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/srv/monitoring/prometheus:/prometheus"
      - "./prometheus:/etc/prometheus"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.loganhill.nz`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.prometheus.middlewares=authentik@docker"

  # Routes alerts from Prometheus to ntfy (alertmanager/alertmanager.yml). Its
  # own UI (active alerts, silences) is at https://prometheus.loganhill.nz/alertmanager/,
  # behind Authentik; Prometheus' hostname is reused so no new DNS record or
  # outpost-callback host is needed. Everything (API, /metrics) sits under that
  # /alertmanager prefix, including for Prometheus and Grafana.
  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    container_name: alertmanager
    restart: always
    user: "1000:1000"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://prometheus.loganhill.nz/alertmanager/"
    volumes:
      - "./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      # ntfy topic URLs (ntfy-critical.url, ntfy-warning.url); not in git
      - "/srv/monitoring/alertmanager/secrets:/etc/alertmanager/secrets:ro"
      - "/srv/monitoring/alertmanager/data:/alertmanager"
    networks:
      - proxy
      - monitoring
    labels:
      - "traefik.enable=true"
      # Longer rule than Prometheus' Host() one, so Traefik gives it priority
      - "traefik.http.routers.alertmanager.rule=Host(`prometheus.loganhill.nz`) && PathPrefix(`/alertmanager`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls=true"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alertmanager.middlewares=authentik@docker"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      - "traefik.docker.network=proxy"

  exporter_pihole:
    image: ekofr/pihole-exporter:v1.4.0@sha256:bd849cd5e0f7f89bf38943d7988c5facfd603d9813c4c089fcff8ed121f718bb
    container_name: exporter_pihole
    restart: always
    networks:
      - proxy
      - monitoring
    env_file:
      - .env.exporter_pihole
    environment:
      - "PIHOLE_HOSTNAME=pihole"
      - "PIHOLE_PORT=443"
      - "PORT=9617"
      - "PIHOLE_PROTOCOL=https"
      - "SKIP_TLS_VERIFICATION=true"
    volumes:
      - "/etc/ssl/certs:/etc/ssl/certs:ro"

  exporter_ros:
    image: ghcr.io/akpw/mktxp:1.2.17@sha256:bd6f22f7db0a79557c4af8a73aa22517f4c32d54fafa19fb0de29e7332440613
    container_name: exporter_ros
    restart: always
    networks:
      - monitoring
    user: root
    volumes:
      - "/srv/monitoring/exporter_ros/:/root/mktxp/"

  exporter_svr:
    image: prom/node-exporter:v1.11.1@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    container_name: exporter_svr
    restart: always
    # host network so the netdev collector sees the real NICs; on a bridge
    # network it only sees its own container eth0. Prometheus reaches it via
    # host.docker.internal:9100 (docker0, 172.17.0.1).
    network_mode: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|srv/\.zfs/snapshot)($$|/)'
      - '--collector.netdev.device-exclude=^(lo|veth.*|br-.*|docker0)$$'
      - '--collector.netclass.ignored-devices=^(lo|veth.*|br-.*|docker0)$$'
      - '--collector.textfile.directory=/textfile'
      # docker0's address = host.docker.internal for Prometheus; not exposed on the LAN
      - '--web.listen-address=172.17.0.1:9100'
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro,rslave"
      # written by gpu-procs/gpu-procs.sh (per-container GPU usage)
      - "/srv/monitoring/textfile:/textfile:ro"

  exporter_gpu:
    image: utkuozdemir/nvidia_gpu_exporter:1.19.0@sha256:4b18ec4390279d90c8f40e952ba1d575f7df1691f29bb5be79843238483b35f5
    container_name: exporter_gpu
    restart: always
    networks:
      - monitoring
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Probes services end to end: public hostnames through Traefik (TLS/routing),
  # app health endpoints on the Docker network, Pi-hole DNS, and LAN devices.
  # On proxy too, to reach the apps' backends directly.
  exporter_blackbox:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: exporter_blackbox
    restart: always
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - "./blackbox:/etc/blackbox:ro"
    networks:
      - monitoring
      - proxy

  # --- logs: Alloy -> Loki, viewed in Grafana --------------------------------
  loki:
    image: grafana/loki:3.6.0@sha256:6a705de65df88aa0d90a44779606b0042722c86637335a73858f65f9fe9f9557
    container_name: loki
    restart: always
    # Runs as logan so /srv/monitoring/loki can stay owned by the usual user.
    user: "1000:1000"
    command:
      - '-config.file=/etc/loki/loki.yml'
    volumes:
      - "./loki/loki.yml:/etc/loki/loki.yml:ro"
      - "/srv/monitoring/loki:/loki"
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.12.0@sha256:85e4a706181741dd735d9a69bea81f9e03e16d5349bff46dd9640379f143c007
    container_name: alloy
    restart: always
    depends_on:
      - loki
      - alloy-socket-proxy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # default is 127.0.0.1, which Prometheus can't scrape
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - "./alloy/config.alloy:/etc/alloy/config.alloy:ro"
      # read positions, so a restart doesn't re-ship or skip logs
      - "/srv/monitoring/alloy:/var/lib/alloy/data"
      - "/var/log/journal:/var/log/journal:ro"
      - "/etc/machine-id:/etc/machine-id:ro"
    networks:
      - monitoring
      - alloy-socket

  # Same pattern as traefik-socket-proxy: Alloy only gets GET on container
  # list/inspect/logs, networks (discovery labels) and events, never the raw socket.
  alloy-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    container_name: alloy-socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - NETWORKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alloy-socket

  exporter_smart:
    image: prometheuscommunity/smartctl-exporter:v0.14.0@sha256:cfe22c36d7d2fac48ebf619707305acb65eb0fb670656eb80f356e606d782bc1
    container_name: exporter_smart
    restart: always
    privileged: true
    user: root
    networks:
      - monitoring
    command:
      - '--smartctl.interval=120s'
      # the PERC also exposes each disk as bus_0_megaraid_N; keep only /dev/sdX
      - '--smartctl.device-exclude=^bus_'

  # per-container CPU/memory/network; only the cheap collectors are enabled
  exporter_cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0@sha256:c3770bd6fc6c6a9cb2b47143e6b3cc3fdd9d20a8453dffbb7e09a145e7e0c4e4
    container_name: exporter_cadvisor
    restart: always
    privileged: true
    networks:
      - monitoring
    devices:
      - /dev/kmsg
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=15s'
      - '--store_container_labels=false'
      - '--enable_metrics=cpu,memory,network,oom_event'
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"

  exporter_zfs:
    image: matusnovak/prometheus-zfs:latest@sha256:34e36ffc902237d73918003ac3ecefad0177042e1bb1983ffdff7159cc5b6711
    container_name: exporter_zfs
    restart: always
    privileged: true
    networks:
      - monitoring

  exporter_idrac:
    image: mrlhansen/idrac_exporter:2.2.0@sha256:16275f896172767fde9664d3d0785678e69eb2b96d36127905c736be210d3da3
    container_name: exporter_idrac
    restart: always
    networks:
      - monitoring
    volumes:
      - "./idrac.yml:/etc/prometheus/idrac.yml"

networks:
  # Exporters live here; only Prometheus, Grafana, Alertmanager (Traefik routes to them) and
  # exporter_pihole (Pi-hole is on proxy) are also on proxy.
  monitoring:
    name: monitoring
  # Alloy <-> its socket proxy only; no outside access.
  alloy-socket:
    name: alloy-socket
    internal: true
  proxy:
    name: proxy
    enable_ipv6: true
    external: true
