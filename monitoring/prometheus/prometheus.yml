global:
  external_labels:
    monitor: kiwinest
  evaluation_interval: 15s
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']

  - job_name: pihole
    static_configs:
      - targets: ['exporter_pihole:9617']

  - job_name: mikrotik
    static_configs:
      - targets: ['exporter_ros:49090']

  - job_name: svr
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: kiwisvr01

  - job_name: gpu
    static_configs:
      - targets: ['exporter_gpu:9835']
        labels:
          instance: kiwisvr01

  - job_name: smart
    static_configs:
      - targets: ['exporter_smart:9633']
        labels:
          instance: kiwisvr01

  - job_name: cadvisor
    static_configs:
      - targets: ['exporter_cadvisor:8080']
        labels:
          instance: kiwisvr01

  - job_name: svr_zfs
    static_configs:
      - targets: ['exporter_zfs:9901']

  - job_name: minecraft
    metrics_path: '/'
    static_configs:
      - targets: ['kiwisvr01:19565']

  # Redfish on the iDRAC is slow (seconds per endpoint), so scrape it rarely
  # with a long timeout; the 15s default timed out most of the time.
  - job_name: idrac
    scrape_interval: 60s
    scrape_timeout: 55s
    static_configs:
      - targets: ['10.4.20.21']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: exporter_idrac:9348
