global:
  external_labels:
    monitor: kiwinest
  evaluation_interval: 15s
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']

  - job_name: pihole
    static_configs:
      - targets: ['exporter_pihole:9617']

  - job_name: mikrotik
    static_configs:
      - targets: ['exporter_ros:49090']

  - job_name: svr
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: kiwisvr01

  - job_name: gpu
    static_configs:
      - targets: ['exporter_gpu:9835']
        labels:
          instance: kiwisvr01

  - job_name: smart
    static_configs:
      - targets: ['exporter_smart:9633']
        labels:
          instance: kiwisvr01

  - job_name: cadvisor
    static_configs:
      - targets: ['exporter_cadvisor:8080']
        labels:
          instance: kiwisvr01

  - job_name: svr_zfs
    static_configs:
      - targets: ['exporter_zfs:9901']

  # Redfish on the iDRAC is slow (seconds per endpoint), so scrape it rarely
  # with a long timeout; the 15s default timed out most of the time.
  - job_name: idrac
    scrape_interval: 60s
    scrape_timeout: 55s
    static_configs:
      - targets: ['10.4.20.21']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: exporter_idrac:9348

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  # --- blackbox probes (monitoring/blackbox/blackbox.yml) ---------------------
  # Each target is passed to exporter_blackbox as ?target=; `service` is a short
  # name for dashboards.
  - job_name: blackbox_edge
    metrics_path: /probe
    params:
      module: [edge_https]
    static_configs:
      - targets:
          - 'https://auth.loganhill.nz/'
          - 'https://jellyfin.loganhill.nz/'
          - 'https://seerr.loganhill.nz/'
          - 'https://sonarr.loganhill.nz/'
          - 'https://radarr.loganhill.nz/'
          - 'https://lidarr.loganhill.nz/'
          - 'https://prowlarr.loganhill.nz/'
          - 'https://qbittorrent.loganhill.nz/'
          - 'https://questarr.loganhill.nz/'
          - 'https://immich.loganhill.nz/'
          - 'https://grafana.loganhill.nz/'
          - 'https://prometheus.loganhill.nz/'
          - 'https://pihole.loganhill.nz/'
          - 'https://traefik.loganhill.nz/'
          - 'https://unifi.loganhill.nz/'
          # file-provider route (/srv/traefik/dynamic/config.toml); the iDRAC only accepts
          # this Host because it's in its iDRAC.WebServer.ManualDNSEntry / host-header settings
          - 'https://kiwisvr01-idrac.loganhill.nz/'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'https://([^.]+)\..*'
        target_label: service
      - target_label: __address__
        replacement: exporter_blackbox:9115

  - job_name: blackbox_backend
    metrics_path: /probe
    params:
      module: [backend_http]
    static_configs:
      - targets:
          - 'http://authentik-server:9000/-/health/live/'
          - 'http://grafana:3000/api/health'
          - 'http://prometheus:9090/-/healthy'
          - 'http://immich_server:2283/api/server/ping'
          - 'http://jellyfin:8096/health'
          - 'http://seerr:5055/api/v1/status'
          - 'http://sonarr:8989/ping'
          - 'http://radarr:7878/ping'
          - 'http://lidarr:8686/ping'
          - 'http://prowlarr:9696/ping'
          - 'http://qbittorrent:8080/'
          - 'http://questarr:5000/api/health'
          - 'http://pihole:80/admin/'
          - 'https://unifi-os-server:443/'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'https?://([^:/]+).*'
        target_label: service
      # Same `service` as the hostname probe, so Alertmanager can match the two
      - source_labels: [service]
        regex: authentik-server
        target_label: service
        replacement: auth
      - source_labels: [service]
        regex: immich_server
        target_label: service
        replacement: immich
      - source_labels: [service]
        regex: unifi-os-server
        target_label: service
        replacement: unifi
      - target_label: __address__
        replacement: exporter_blackbox:9115

  - job_name: blackbox_dns
    metrics_path: /probe
    static_configs:
      - targets: ['10.4.20.20:53']
        labels: {module: dns_local, service: pihole-local}
      - targets: ['10.4.20.20:53']
        labels: {module: dns_upstream, service: pihole-upstream}
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: exporter_blackbox:9115

  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ['10.4.20.254']
        labels: {service: router}
      - targets: ['10.4.20.21']
        labels: {service: idrac}
      # UniFi switch/AP have no DNS names; IPs from the UniFi controller.
      - targets: ['10.4.20.85']
        labels: {service: switch}
      - targets: ['10.4.20.51']
        labels: {service: ap}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: exporter_blackbox:9115
