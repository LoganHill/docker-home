global:
  external_labels:
    monitor: kiwinest
  evaluation_interval: 15s
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']

  - job_name: pihole
    static_configs:
      - targets: ['exporter_pihole:9617']

  - job_name: mikrotik
    static_configs:
      - targets: ['exporter_ros:49090']

  - job_name: svr
    static_configs:
      - targets: ['exporter_svr:9100']

  - job_name: svr_zfs
    static_configs:
      - targets: ['exporter_zfs:9901']

  - job_name: idrac
    static_configs:
      - targets: ['exporter_idrac:9348']