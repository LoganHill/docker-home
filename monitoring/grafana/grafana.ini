[auth]
disable_login_form = true

[auth.proxy]
enabled = true
header_name = X-authentik-username
header_property = username
auto_sign_up = true
headers = Groups:X-authentik-groups
enable_login_token = false
# Only accept the header from Traefik (static IP in traefik/docker-compose.yml);
# otherwise any container on the proxy network could send it and log in as anyone.
whitelist = 172.23.255.250

