# Push a notification to ntfy whenever Renovate opens an update PR.
# Needs the repo secret NTFY_URL (full topic URL, e.g. https://ntfy.sh/<topic>);
# without it the job fails, so a missing or empty secret is visible.
name: ntfy on Renovate PR

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send to ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$NTFY_URL" ]; then echo "::error::NTFY_URL secret is missing or empty"; exit 1; fi
          # Edge components (labels aren't on the PR yet at "opened", so match the title)
          tags=package
          if printf '%s' "$TITLE" | grep -Eqi 'traefik|authentik|cloudflared|postgres|socket-proxy'; then tags=package,warning; fi
          curl -fsS --max-time 20 \
            -H "Title: Renovate PR" \
            -H "Tags: $tags" \
            -H "Click: $PR_URL" \
            --data-binary "$TITLE" \
            "$NTFY_URL" >/dev/null
