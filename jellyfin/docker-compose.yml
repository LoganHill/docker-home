services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls59@sha256:2f708001387aa9853e744a4a4d572d9970927c479c56d6c9e199f789c5173535
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
      - JELLYFIN_PublishedServerUrl=https://jellyfin.loganhill.nz
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - proxy
    volumes:
      - /srv/jellyfin/config:/config
      - /srv/data/media:/data/media
    ports:
      - 7359:7359/udp
      - 1900:1900/udp
    labels:
      traefik.enable: true
      traefik.http.routers.jellyfin.rule: Host(`jellyfin.loganhill.nz`)
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls: true
      traefik.http.routers.jellyfin.tls.certresolver: letsencrypt
      traefik.http.services.jellyfin.loadbalancer.server.port: 8096
      traefik.docker.network: proxy
      #traefik.http.routers.jellyfin.middlewares: authentik@docker
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - /srv/sonarr/config:/config
      - /srv/data:/data
    networks:
      - proxy
    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr.rule: Host(`sonarr.loganhill.nz`)
      traefik.http.routers.sonarr.entrypoints: websecure
      traefik.http.routers.sonarr.tls: true
      traefik.http.routers.sonarr.tls.certresolver: letsencrypt
      traefik.http.services.sonarr.loadbalancer.server.port: 8989
      traefik.docker.network: proxy
      traefik.http.routers.sonarr.middlewares: authentik@docker
  
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls326@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - /srv/radarr/config:/config
      - /srv/data:/data
    networks:
      - proxy
    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.radarr.rule: Host(`radarr.loganhill.nz`)
      traefik.http.routers.radarr.entrypoints: websecure
      traefik.http.routers.radarr.tls: true
      traefik.http.routers.radarr.tls.certresolver: letsencrypt
      traefik.http.services.radarr.loadbalancer.server.port: 7878
      traefik.docker.network: proxy
      traefik.http.routers.radarr.middlewares: authentik@docker

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.6.5079-ls48@sha256:a91ef0642c15c9bd7c4260fee98fa99972c61601e37c8a96411d6a9cf0e9ad40
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - /srv/lidarr/config:/config
      - /srv/data:/data
    networks:
      - proxy
    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.lidarr.rule: Host(`lidarr.loganhill.nz`)
      traefik.http.routers.lidarr.entrypoints: websecure
      traefik.http.routers.lidarr.tls: true
      traefik.http.routers.lidarr.tls.certresolver: letsencrypt
      traefik.http.services.lidarr.loadbalancer.server.port: 8686
      traefik.docker.network: proxy
      traefik.http.routers.lidarr.middlewares: authentik@docker

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls168@sha256:6660787a99b2e58203539583663c973b48979fc00ff2cb78dc0ea17429e1f6ef
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - /srv/prowlarr/data:/config
    networks:
      - proxy
    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.loganhill.nz`)
      traefik.http.routers.prowlarr.entrypoints: websecure
      traefik.http.routers.prowlarr.tls: true
      traefik.http.routers.prowlarr.tls.certresolver: letsencrypt
      traefik.http.services.prowlarr.loadbalancer.server.port: 9696
      traefik.docker.network: proxy
      traefik.http.routers.prowlarr.middlewares: authentik@docker

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls487@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /srv/qbittorrent:/config
      - /srv/data/torrents:/data/torrents
    ports:
      - 6881:6881
      - 6881:6881/udp
    networks:
      - proxy
    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.qbittorrent.rule: Host(`qbittorrent.loganhill.nz`)
      traefik.http.routers.qbittorrent.entrypoints: websecure
      traefik.http.routers.qbittorrent.tls: true
      traefik.http.routers.qbittorrent.tls.certresolver: letsencrypt
      traefik.http.services.qbittorrent.loadbalancer.server.port: 8080
      traefik.docker.network: proxy
      traefik.http.routers.qbittorrent.middlewares: authentik@docker

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Pacific/Auckland
    networks:
      - proxy
    restart: always

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=Pacific/Auckland
      - PORT=5055
    networks:
      - proxy
    volumes:
      - /srv/jellyseerr:/app/config
    restart: always
    labels:
      traefik.enable: true
      traefik.http.routers.seerr.rule: Host(`seerr.loganhill.nz`)
      traefik.http.routers.seerr.entrypoints: websecure
      traefik.http.routers.seerr.tls: true
      traefik.http.routers.seerr.tls.certresolver: letsencrypt
      traefik.http.routers.seerr.service: seerr
      traefik.http.services.seerr.loadbalancer.server.port: 5055
      traefik.docker.network: proxy
      # No authentik@docker here on purpose: this Seerr build (v3.4.1) has no
      # trusted-header/forward-auth support (verified against the running app, no
      # forwardAuth config or code path exists), so gating it here would just bring
      # back the double login. Revisit if Seerr ships stable OIDC (PR #1505) or a
      # header-trust feature in a later release.
      #traefik.http.routers.seerr.middlewares: authentik@docker

networks:
  proxy:
    name: proxy
    enable_ipv6: true
    external: true
