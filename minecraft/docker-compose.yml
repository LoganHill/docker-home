services:
  minecraft:
    image: itzg/minecraft-server:2026.11.1-java25@sha256:0634ff76eee896c7e9760a35117d24fad394857d10bc8c1d9bc7f7ff7deef3c2
    tty: true
    stdin_open: true
    ports:
      - "25565:25565" # mc
      - "19565:19565" # prom
      - "8123:8123" # bluemap
    env_file:
      - .env
    environment:
      EULA: "TRUE"
      TYPE: AUTO_CURSEFORGE
      CF_SLUG: create-ultimate-selection-2
      CF_MODPACK_MANIFEST: /manifests/manifest.json
      MEMORY: 16G
    volumes:
      - /srv/minecraft:/data
      - ./manifests:/manifests:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minecraft.rule=Host(`mc.loganhill.nz`)"
      - "traefik.http.routers.minecraft.entrypoints=websecure"
      - "traefik.http.routers.minecraft.tls=true"
      - "traefik.http.routers.minecraft.tls.certresolver=letsencrypt"
      - "traefik.http.services.minecraft.loadbalancer.server.port=8123"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - minecraft

networks:
  proxy:
    name: proxy
    enable_ipv6: true
    external: true
  minecraft:
    name: minecraft
    enable_ipv6: true