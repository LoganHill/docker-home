services:
  authelia:
    container_name: authelia
    image: authelia/authelia:latest
    restart: always
    user: "1000:1000"
    depends_on:
      - lldap
      - postgres
      - redis
    networks:
      - proxy
    secrets: ["JWT_SECRET", "SESSION_SECRET", "STORAGE_PASSWORD", "STORAGE_ENCRYPTION_KEY", "LDAP_PASSWORD", "REDIS_PASSWORD"]
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: "/run/secrets/JWT_SECRET"
      AUTHELIA_SESSION_SECRET_FILE: "/run/secrets/SESSION_SECRET"
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: "/run/secrets/STORAGE_PASSWORD"
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: "/run/secrets/STORAGE_ENCRYPTION_KEY"
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: "/run/secrets/LDAP_PASSWORD"
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: "/run/secrets/REDIS_PASSWORD"
      TZ: "Pacific/Auckland"
    volumes:
      - "./config:/config"
    labels:
      # Disabled now that authentik-server owns auth.loganhill.nz and all 11
      # forward-auth consumers point at authentik@docker (see authentik/
      # docker-compose.yml). Container stays running for now as a rollback
      # safety net until the migration is confirmed stable — decommission
      # comes later as its own step.
      traefik.enable: 'false'
      traefik.http.routers.authelia.rule: 'Host(`auth.loganhill.nz`)'
      traefik.http.routers.authelia.entrypoints: 'websecure'
      traefik.http.routers.authelia.tls: 'true'
      traefik.http.routers.authelia.tls.options: 'default'
      traefik.http.routers.authelia.tls.certresolver: letsencrypt
      traefik.http.middlewares.authelia.forwardauth.address: 'http://authelia:9091/api/authz/forward-auth'
      traefik.http.middlewares.authelia.forwardauth.trustForwardHeader: 'true'
      traefik.http.middlewares.authelia.forwardauth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Name,Remote-Email'

  postgres:
    container_name: postgres
    image: postgres:17
    restart: always
    shm_size: 512mb
    env_file:
      - .env
    environment:
      POSTGRES_USER: "authelia"
      POSTGRES_DB: "authelia"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - "/srv/postgres:/var/lib/postgresql/data/pgdata"
    networks:
      - proxy
  
  redis:
    container_name: redis
    image: redis
    restart: always
    user: 1000:1000
    volumes:
      - "/srv/redis/data:/data"
      - "/srv/redis/config/:/usr/local/etc/redis/"
    networks:
      - proxy

  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    restart: always
    env_file:
      - .env
    environment:
      - UID=1000
      - GID=1000
      - TZ=Pacific/Auckland
      - LLDAP_LDAP_BASE_DN=dc=loganhill,dc=nz
      - LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET=true
      - LLDAP_SMTP_OPTIONS__SERVER=loganhill-nz.mail.protection.outlook.com
      - LLDAP_SMTP_OPTIONS__PORT=25
      - LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION=TLS
      - LLDAP_SMTP_OPTIONS__FROM=KiwiNest Auth <auth@loganhill.nz>
      - LLDAP_SMTP_OPTIONS__TO=Logan <me@loganhill.nz>
    ports:
      - 3890:3890
    networks:
      - proxy
    volumes:
      - "/srv/lldap:/data"
    labels:
      traefik.enable: 'true'
      traefik.http.routers.lldap.rule: 'Host(`lldap.loganhill.nz`)'
      traefik.http.routers.lldap.entrypoints: 'websecure'
      traefik.http.routers.lldap.tls: 'true'
      traefik.http.routers.lldap.tls.options: 'default'
      traefik.http.routers.lldap.tls.certresolver: letsencrypt
      traefik.http.services.lldap.loadbalancer.server.port: '17170'
    

networks:
  proxy:
    name: proxy
    enable_ipv6: true
    external: true

secrets:
  JWT_SECRET:
    file: '/srv/authelia/secrets/JWT_SECRET'
  SESSION_SECRET:
    file: '/srv/authelia/secrets/SESSION_SECRET'
  STORAGE_PASSWORD:
    file: '/srv/authelia/secrets/STORAGE_PASSWORD'
  STORAGE_ENCRYPTION_KEY:
    file: '/srv/authelia/secrets/STORAGE_ENCRYPTION_KEY'
  LDAP_PASSWORD:
    file: '/srv/authelia/secrets/LDAP_PASSWORD'
  SMTP_PASSWORD:
    file: '/srv/authelia/secrets/SMTP_PASSWORD'
  REDIS_PASSWORD:
    file: '/srv/authelia/secrets/REDIS_PASSWORD'
