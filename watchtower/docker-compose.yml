services:
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    env_file:
      - .env
    environment:
      - "TZ=Pacific/Auckland"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

networks:
  proxy:
    name: proxy
    enable_ipv6: true
    external: true
