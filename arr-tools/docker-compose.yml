services:
  # Removes fake/malware downloads from qBittorrent and the *arr queues.
  # Keep "Disable Auth for Local Addresses" and "Trust Forwarded Headers" OFF in
  # its settings: every container on `proxy` looks local to it.
  # No media or downloads mount on purpose: it only acts through the apps' APIs.
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.11.1@sha256:923c2fe435e22fc58d261bacd2d6bbd8eb1ba3f95358803a8e4d3287ffd919d3
    container_name: cleanuparr
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=Pacific/Auckland
    volumes:
      - /srv/cleanuparr:/config
      # Malware Blocker > Blocklist Path: /blocklists/arr.txt
      - ./cleanuparr:/blocklists:ro
    networks:
      - proxy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      traefik.enable: true
      traefik.docker.network: proxy
      traefik.http.routers.cleanuparr.rule: Host(`cleanuparr.loganhill.nz`)
      traefik.http.routers.cleanuparr.entrypoints: websecure
      traefik.http.routers.cleanuparr.tls: true
      traefik.http.routers.cleanuparr.tls.certresolver: letsencrypt
      traefik.http.routers.cleanuparr.middlewares: authentik@docker
      traefik.http.services.cleanuparr.loadbalancer.server.port: 11011

  # Syncs a few TRaSH Guides custom formats into Sonarr/Radarr (recyclarr/homelab.yml).
  # Preview first: docker compose run --rm recyclarr sync --preview
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    container_name: recyclarr
    user: "1000:1000"
    environment:
      - TZ=Pacific/Auckland
      - CRON_SCHEDULE=@daily
    env_file:
      # SONARR_API_KEY and RADARR_API_KEY (.example.env)
      - path: .env
        required: false
    volumes:
      - /srv/recyclarr:/config
      - ./recyclarr:/config/configs:ro
    networks:
      - proxy
    restart: always

networks:
  proxy:
    name: proxy
    external: true
