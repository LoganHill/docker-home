# Drop-in for restic-backup.service (/etc/systemd/system/restic-backup.service.d/).
#
# Snapshot /srv right before the backup so restic reads one point in time:
# every Postgres/SQLite database is crash-consistent without stopping any
# container. The fixed name keeps the source path (/srv/.zfs/snapshot/restic)
# stable, so restic can reuse the previous run as its parent and skip
# unchanged files. The snapshot is dropped afterwards so it doesn't pin
# deleted media.
[Service]
ExecStartPre=-/usr/sbin/zfs destroy rootpool/srv@restic
ExecStartPre=/usr/sbin/zfs snapshot rootpool/srv@restic
# Mount it before restic opens it. Snapshots under .zfs automount on first
# access, but whoever triggers that still reads the empty placeholder dir, so
# restic would back up 0 files and report success. Fail the run if not mounted.
ExecStartPre=/bin/sh -c 'ls /srv/.zfs/snapshot/restic/ >/dev/null && findmnt /srv/.zfs/snapshot/restic >/dev/null'
ExecStopPost=-/usr/sbin/zfs destroy rootpool/srv@restic
