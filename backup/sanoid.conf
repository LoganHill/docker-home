# /etc/sanoid/sanoid.conf — local ZFS snapshots (rollback, not backup).
#
# /srv is one dataset including the media library, and snapshots keep deleted
# or upgraded media on disk until they expire, so retention stays short.
# Off-site history is restic's job (B2, 7 daily / 4 weekly / 12 monthly).

[rootpool/srv]
	use_template = srv

[template_srv]
	frequently = 0
	hourly = 24
	daily = 7
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes
